# 测试使用独立的文件数据库，与本地运行的 ./data/pipelinedb 隔离
spring.datasource.url=jdbc:h2:file:./build/test-data/testdb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
pipeline.max-clock-skew-seconds=86400
pipeline.max-future-seconds=300
