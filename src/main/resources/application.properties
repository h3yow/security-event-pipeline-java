# H2 文件数据库：服务重启后事件、窗口计数、告警与状态流转均不丢失
spring.datasource.url=jdbc:h2:file:./data/pipelinedb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# 时钟偏移容忍上限（秒）：事件时间早于接入时间超过该值视为时间戳异常
pipeline.max-clock-skew-seconds=86400
# 事件时间允许超前墙上时钟的上限（秒）
pipeline.max-future-seconds=300
